services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    profiles:
      - local

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: yarn dev --host
    environment:
      VITE_WS_BASE: ws://localhost:8000/ws
    depends_on:
      - api
    profiles:
      - local